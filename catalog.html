<!DOCTYPE html>
<html lang="ru">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог ЯрТара</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif; 
            background: linear-gradient(135deg, #f5f7fa 0%, #e8ecf1 100%);
            color: #2c3e50;
            line-height: 1.6;
        }
        
        .container { 
            max-width: 1400px; 
            margin: auto; 
            padding: 0 20px; 
        }
        
        header { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; 
            padding: 1.2rem 0;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        header .container { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            flex-wrap: wrap; 
            gap: 1rem; 
        }
        
        .logo h1 { 
            font-size: 2rem; 
            background: linear-gradient(135deg, #fff 0%, #ffd89b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 800;
        }
        
        .logo p { 
            font-size: 0.9rem; 
            opacity: 0.95;
            margin-top: 0.2rem;
        }
        
        nav ul { 
            display: flex; 
            list-style: none; 
            gap: 1.5rem; 
        }
        
        nav a { 
            color: white; 
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s;
            padding: 0.5rem 1rem;
            border-radius: 8px;
        }
        
        nav a:hover { 
            color: #ffd89b;
            background: rgba(255,255,255,0.1);
            transform: translateY(-2px);
        }
        
        .contact-info {
            background: rgba(255,255,255,0.15);
            padding: 0.6rem 1.2rem;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        
        .contact-info p {
            margin: 0;
            font-size: 0.9rem;
        }
        
        .hero {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-align: center;
            padding: 3rem 0;
            margin-bottom: 2rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        
        .hero h1 {
            font-size: 2.8rem;
            margin-bottom: 0.5rem;
            font-weight: 800;
        }
        
        #updateInfo { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1rem 1.5rem; 
            border-radius: 15px; 
            display: inline-block; 
            margin: 1.5rem 0;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
            font-weight: 600;
            font-size: 1.05rem;
        }
        
        .products-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); 
            gap: 25px; 
            margin: 2rem 0 3rem;
        }
        
        .product-card { 
            background: white;
            border: none;
            border-radius: 20px;
            padding: 1.5rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            position: relative;
            overflow: hidden;
        }
        
        .product-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transform: scaleX(0);
            transition: transform 0.3s;
        }
        
        .product-card:hover::before {
            transform: scaleX(1);
        }
        
        .product-card:hover { 
            transform: translateY(-8px);
            box-shadow: 0 12px 30px rgba(102, 126, 234, 0.25);
        }
        
        .product-link { 
            text-decoration: none; 
            color: inherit; 
            display: block;
        }
        
        .product-card h3 {
            font-size: 1.1rem;
            color: #2c3e50;
            margin-bottom: 0.8rem;
            line-height: 1.4;
            min-height: 3rem;
        }
        
        .price { 
            font-size: 1.6rem; 
            font-weight: 800;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 10px 0;
        }
        
        .stock { 
            color: #27ae60; 
            font-weight: 600;
            font-size: 0.95rem;
        }
        
        .category-badge {
            display: inline-block;
            background: linear-gradient(135deg, #ffeaa7 0%, #fdcb6e 100%);
            color: #2d3436;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-top: 0.8rem;
        }
        
        footer { 
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: white; 
            text-align: center; 
            padding: 2rem 0;
            margin-top: 3rem;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
        }
        
        .error-message {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
            color: white;
            padding: 2rem;
            border-radius: 15px;
            text-align: center;
            font-size: 1.1rem;
            box-shadow: 0 4px 15px rgba(238, 90, 111, 0.3);
        }
        
        @media (max-width: 768px) { 
            header .container { 
                flex-direction: column; 
                text-align: center; 
            }
            .hero h1 {
                font-size: 2rem;
            }
            .products-grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
                gap: 15px;
            }
            nav ul {
                flex-wrap: wrap;
                justify-content: center;
            }
        }
        
        /* Анимация загрузки */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .product-card {
            animation: fadeIn 0.5s ease-out;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="logo">
                <h1>ЯрТара</h1>
                <p>Стеклянные банки и товары для дома оптом</p>
            </div>
            <nav>
                <ul>
                    <li><a href="index.html">Главная</a></li>
                    <li><a href="catalog.html">Каталог</a></li>
                    <li><a href="index.html#contacts">Контакты</a></li>
                </ul>
            </nav>
            <div class="contact-info">
                <p>📍 г. Новосибирск, ул. Сибиряков-Гвардейцев, 49/1</p>
            </div>
        </div>
    </header>

    <section class="hero">
        <div class="container">
            <h1>Каталог товаров</h1>
            <p style="font-size: 1.1rem; opacity: 0.95;">Более 500 позиций оптовой продукции</p>
            <div id="updateInfo" class="update-info">Загрузка...</div>
        </div>
    </section>

    <div class="container">
        <div id="catalogGrid" class="products-grid"></div>
    </div>

    <footer>
        <div class="container">
            <p>&copy; 2026 ЯрТара. Все права защищены. Цены оптовые, с НДС.</p>
        </div>
    </footer>

    <script>
        fetch('data/products.json?v=' + Date.now())
            .then(res => res.json())
            .then(data => {
                const products = data.items;
                const lastUpdated = data.last_updated || "неизвестно";
                document.getElementById('updateInfo').innerHTML = `📅 Прайс-лист обновлён: ${data.last_updated} · Всего товаров: ${products.length}`;
                const grid = document.getElementById('catalogGrid');
                grid.innerHTML = products.map((p, index) => `
                    <a href="product.html?id=${p.id}" class="product-link" style="animation-delay: ${index * 0.02}s">
                        <div class="product-card">
                            <h3>${escapeHtml(p.name)}</h3>
                            <div class="price">💰 ${p.price.toFixed(2)} ₽</div>
                            <div class="stock">📦 Остаток: ${p.stock} шт</div>
                            <span class="category-badge">${p.category}</span>
                        </div>
                    </a>
                `).join('');
            })
            .catch(err => {
                document.getElementById('catalogGrid').innerHTML = '<div class="error-message">❌ Ошибка загрузки. Проверьте, что файл data/products.json существует.</div>';
                console.error(err);
            });

        function escapeHtml(str) {
            return str.replace(/[&<>]/g, m => ({'&':'&','<':'<','>':'>'}[m]));
        }
    </script>
</body>
</html>
