<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЯрТара - Товар</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif; 
            background: linear-gradient(135deg, #f5f7fa 0%, #e8ecf1 100%);
            color: #2c3e50;
            line-height: 1.6;
        }
        
        .container { 
            max-width: 1200px; 
            margin: auto; 
            padding: 0 20px; 
        }
        
        header { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; 
            padding: 1.2rem 0;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        header .container { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            flex-wrap: wrap; 
            gap: 1rem; 
        }
        
        .logo h1 { 
            font-size: 2rem; 
            background: linear-gradient(135deg, #fff 0%, #ffd89b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 800;
        }
        
        .logo p { 
            font-size: 0.9rem; 
            opacity: 0.95;
            margin-top: 0.2rem;
        }
        
        nav ul { 
            display: flex; 
            list-style: none; 
            gap: 1.5rem; 
        }
        
        nav a { 
            color: white; 
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s;
            padding: 0.5rem 1rem;
            border-radius: 8px;
        }
        
        nav a:hover { 
            color: #ffd89b;
            background: rgba(255,255,255,0.1);
            transform: translateY(-2px);
        }
        
        .contact-info {
            background: rgba(255,255,255,0.15);
            padding: 0.6rem 1.2rem;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        
        .contact-info p {
            margin: 0;
            font-size: 0.9rem;
        }
        
        .product-detail { 
            display: flex; 
            gap: 40px; 
            flex-wrap: wrap; 
            background: white;
            border-radius: 20px; 
            padding: 40px; 
            margin: 40px 0;
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
            animation: fadeIn 0.6s ease-out;
        }
        
        .gallery { 
            flex: 1; 
            min-width: 300px;
        }
        
        .gallery img { 
            max-width: 100%; 
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            transition: transform 0.3s;
        }
        
        .gallery img:hover {
            transform: scale(1.02);
        }
        
        .info { 
            flex: 2; 
            min-width: 300px;
        }
        
        .info h1 {
            font-size: 2rem;
            color: #2c3e50;
            margin-bottom: 1rem;
            line-height: 1.3;
        }
        
        .price { 
            font-size: 2.5rem; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 800;
            margin: 15px 0;
        }
        
        .info p {
            font-size: 1.05rem;
            margin: 0.8rem 0;
        }
        
        .info strong {
            color: #667eea;
            font-weight: 700;
        }
        
        .description {
            background: #f8f9fa;
            padding: 1.5rem;
            border-radius: 12px;
            margin: 1.5rem 0;
            border-left: 4px solid #667eea;
            white-space: pre-line;
            line-height: 1.8;
        }
        
        .btn { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; 
            padding: 15px 35px; 
            border: none; 
            border-radius: 50px; 
            cursor: pointer; 
            font-size: 1.1rem; 
            margin-top: 20px; 
            transition: all 0.3s;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn:hover { 
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.5);
        }
        
        .back-link {
            display: inline-block;
            margin: 2rem 0 1rem;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .back-link:hover {
            color: #764ba2;
            transform: translateX(-5px);
        }
        
        footer { 
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: white; 
            text-align: center; 
            padding: 2rem 0;
            margin-top: 3rem;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
        }
        
        .error-message {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
            color: white;
            padding: 3rem;
            border-radius: 15px;
            text-align: center;
            font-size: 1.1rem;
            box-shadow: 0 4px 15px rgba(238, 90, 111, 0.3);
            margin: 40px 0;
        }
        
        .error-message a {
            color: white;
            text-decoration: underline;
            font-weight: 600;
        }
        
        @media (max-width: 768px) { 
            header .container { 
                flex-direction: column; 
                text-align: center; 
            }
            .product-detail {
                padding: 20px;
                gap: 20px;
            }
            .info h1 {
                font-size: 1.5rem;
            }
            .price {
                font-size: 2rem;
            }
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="logo">
                <h1>ЯрТара</h1>
                <p>Стеклянные банки и товары для дома оптом</p>
            </div>
            <nav>
                <ul>
                    <li><a href="index.html">Главная</a></li>
                    <li><a href="catalog.html">Каталог</a></li>
                    <li><a href="index.html#contacts">Контакты</a></li>
                </ul>
            </nav>
            <div class="contact-info">
                <p>📍 г. Новосибирск, ул. Сибиряков-Гвардейцев, 49/1</p>
            </div>
        </div>
    </header>

    <div class="container" id="productContainer">
        <a href="catalog.html" class="back-link">← Вернуться в каталог</a>
        Загрузка...
    </div>

    <footer>
        <div class="container">
            <p>&copy; 2026 ЯрТара. Все права защищены. Цены оптовые, с НДС.</p>
        </div>
    </footer>

    <script>
        const productId = new URLSearchParams(window.location.search).get('id');

        async function loadProduct() {
            const container = document.getElementById('productContainer');
            if (!productId) {
                container.innerHTML = `
                    <a href="catalog.html" class="back-link">← Вернуться в каталог</a>
                    <div class="error-message">
                        ❌ Товар не указан. Перейдите из <a href="catalog.html">каталога</a>.
                    </div>
                `;
                return;
            }
            try {
                const res = await fetch('data/products.json?v=' + Date.now());
                const data = await res.json();
                const products = data.items;
                const product = products.find(p => p.id == productId);
                if (!product) throw new Error();
                
                container.innerHTML = `
                    <a href="catalog.html" class="back-link">← Вернуться в каталог</a>
                    <div class="product-detail">
                        <div class="gallery">
                            <img src="${product.images?.[0] || 'https://via.placeholder.com/400x300?text=Фото'}" alt="${escapeHtml(product.name)}">
                        </div>
                        <div class="info">
                            <h1>${escapeHtml(product.name)}</h1>
                            <div class="price">💰 ${product.price.toFixed(2)} ₽</div>
                            <p>📦 В наличии: <strong>${product.stock} шт.</strong></p>
                            ${product.volume ? `<p>📏 Объём: <strong>${product.volume}</strong></p>` : ''}
                            ${product.diameter ? `<p>🔘 Диаметр горла: <strong>${product.diameter}</strong></p>` : ''}
                            <div class="description">${escapeHtml(product.description)}</div>
                            <button class="btn" onclick="alert('📞 Свяжитесь с нами: +7 (913) 735-55-81')">📲 Заказать</button>
                        </div>
                    </div>
                `;
            } catch(e) {
                container.innerHTML = `
                    <a href="catalog.html" class="back-link">← Вернуться в каталог</a>
                    <div class="error-message">
                        ❌ Товар не найден или ошибка загрузки.<br>
                        <a href="catalog.html">Вернуться в каталог</a>
                    </div>
                `;
            }
        }

        function escapeHtml(str) {
            return str.replace(/[&<>]/g, m => ({'&':'&','<':'<','>':'>'}[m]));
        }

        loadProduct();
    </script>
</body>
</html>
