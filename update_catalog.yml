name: Auto Update Catalog

on:
  push:
    branches:
      - main  # Запуск при каждом пуше в ветку main
  schedule:
    - cron: '0 0 * * *' # Автозапуск каждый день в полночь по UTC (можно изменить)
  workflow_dispatch: # Позволяет запускать скрипт вручную кнопкой в интерфейсе GitHub

permissions:
  contents: write # Разрешение на запись, чтобы экшен мог запушить измененные файлы

jobs:
  update:
    runs-back-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Если у вас есть библиотеки (например, requests, beautifulsoup4), раскомментируйте строку ниже:
        # pip install -r requirements.txt 

    - name: Run update script
      run: python update_catalog.py

    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@://github.com"
        git add .
        # Проверяем, изменилось ли что-то, чтобы избежать пустых коммитов
        if ! git diff --cached --quiet; then
          git commit -m "Auto-update catalog data"
          git push
        else
          echo "No changes to commit"
        fi
